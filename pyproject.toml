[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ossc"
version = "1.0.0"
description = "One-Shot Strategic Classification Under Unknown Costs (ICML 2024)"
readme = "README.md"
authors = [
    { name = "Bhavya", email = "bhavya@iitgn.ac.in" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

